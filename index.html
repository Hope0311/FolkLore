<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffd27a">
  <title>Malaysian Folk Tales</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="app">
    <header class="top">
      <div class="lang" id="lang" data-active="en" role="group" aria-label="Language / Bahasa">
        <i class="thumb" aria-hidden="true"></i>
        <button type="button" data-lang="en" aria-label="English">EN</button>
        <button type="button" data-lang="bm" aria-label="Bahasa Melayu">BM</button>
      </div>
    </header>

    <main class="book-wrap">
      <div class="book" id="book"></div>
    </main>

    <nav class="nav">
      <button type="button" class="btn btn-prev" id="prev" data-ui-label="prev">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
      </button>
      <div class="progress" aria-hidden="true">
        <span id="plabel"></span>
        <div class="bar"><i id="pfill"></i></div>
      </div>
      <button type="button" class="btn btn-next" id="next" data-ui-label="next">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
      </button>
    </nav>
  </div>

  <noscript>Please turn on JavaScript to read the story. / Sila hidupkan JavaScript untuk membaca cerita.</noscript>
  <script src="stories.js"></script>
  <script src="app.js"></script>
</body>
</html>
